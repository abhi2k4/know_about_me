<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Contact Form Submission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        background-color: #f7f7f9;
        padding: clamp(16px, 4vw, 40px);
        color: #3f3f46;
        -webkit-font-smoothing: antialiased;
      }

      .email-container {
        max-width: 580px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e4e4e7;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        padding: clamp(24px, 6vw, 40px);
      }

      .sub-label {
        font-size: 0.75rem;
        font-weight: 700;
        color: #b45309; /* Warm gold/amber accent */
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 8px;
        display: block;
      }

      .brand-header {
        font-size: 1.25rem;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 32px;
      }

      .headline {
        font-size: clamp(1.5rem, 4vw, 1.85rem);
        font-weight: 700;
        color: #0f172a;
        line-height: 1.25;
        letter-spacing: -0.025em;
        margin-bottom: 20px;
      }

      .introduction {
        font-size: 0.975rem;
        color: #52525b;
        margin-bottom: 32px;
      }

      /* Inner Highlight Box */
      .message-box {
        background-color: #f9f9fb;
        border: 1px solid #f1f1f4;
        border-radius: 16px;
        padding: clamp(20px, 4vw, 28px);
        margin-bottom: 32px;
      }

      .message-box-title {
        font-size: 0.75rem;
        font-weight: 700;
        color: #71717a;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 16px;
        display: block;
      }

      .field {
        margin-bottom: 16px;
      }

      .field:last-child {
        margin-bottom: 0;
      }

      .field-label {
        font-size: 0.75rem;
        font-weight: 600;
        color: #a1a1aa;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        display: block;
        margin-bottom: 4px;
      }

      .field-value {
        font-size: 0.95rem;
        color: #18181b;
        word-break: break-word;
      }

      .field-value a {
        color: #0f172a;
        text-decoration: underline;
        font-weight: 500;
      }

      .btn-container {
        margin-top: 24px;
      }

      .btn {
        display: inline-block;
        background-color: #0f172a;
        color: #ffffff;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 9999px;
        transition: background-color 0.2s ease;
        text-align: center;
      }

      .btn:hover {
        background-color: #1e293b;
      }

      /* Footer */
      .footer {
        margin-top: 40px;
        padding-top: 24px;
        border-top: 1px solid #f1f1f4;
        text-align: center;
      }

      .footer-info {
        font-size: 0.75rem;
        color: #71717a;
        margin-bottom: 12px;
      }

      .footer-info a {
        color: #71717a;
        text-decoration: underline;
      }

      .social-links {
        display: flex;
        justify-content: center;
        gap: 16px;
      }

      .social-links a {
        font-size: 0.75rem;
        color: #a1a1aa;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .social-links a:hover {
        color: #0f172a;
      }

      @media print {
        body {
          background: none;
          padding: 0;
          color: #000000;
        }
        
        .email-container {
          box-shadow: none;
          border: none;
          padding: 0;
        }
        
        .message-box {
          background: #ffffff;
          border: 1px solid #e4e4e7;
        }
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <span class="sub-label">New Submission</span>
      <h1 class="brand-header">ABHISHEK THORMOTHE</h1>
      
      <h2 class="headline">New message from {{name}}</h2>
      
      <p class="introduction">
        You have received a new contact submission from your portfolio website.
      </p>

      <div class="message-box">
        <span class="message-box-title">Message Details</span>
        
        <div class="field">
          <span class="field-label">Sender Email</span>
          <div class="field-value">
            <a href="mailto:{{email}}">{{email}}</a>
          </div>
        </div>

        <div class="field">
          <span class="field-label">Message</span>
          <div class="field-value">{{message}}</div>
        </div>

        <div class="btn-container">
          <a href="mailto:{{email}}?subject=Re:%20Portfolio%20Inquiry" class="btn">Reply via Email</a>
        </div>
      </div>

      <div class="footer">
        <div class="footer-info">
          Received on {{timestamp}} • Sent from <a href="https://abhishekthormothe.in" target="_blank">abhishekthormothe.in</a>
        </div>
        <div class="social-links">
          <a href="https://linkedin.com/in/thormotheabhishek" target="_blank">LinkedIn</a>
          <span>·</span>
          <a href="https://github.com/abhi2k4" target="_blank">GitHub</a>
          <span>·</span>
          <a href="https://abhishekthormothe.in" target="_blank">Portfolio</a>
        </div>
      </div>
    </div>
  </body>
</html>
