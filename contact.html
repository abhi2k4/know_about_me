<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Contact Form Submission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        background-color: #080808;
        padding: clamp(12px, 3vw, 24px);
        color: rgba(255, 255, 255, 0.9);
      }

      .email-container {
        max-width: 600px;
        margin: 0 auto;
        background: #0c0c0c;
        border: 1px solid #1f1f1f;
        border-radius: 0px; /* Sharp corners to match theme */
        overflow: hidden;
      }

      .header {
        background: #080808;
        padding: clamp(24px, 5vw, 32px);
        border-bottom: 2px solid #E61919; /* Vivid red accent line */
        text-align: left;
      }

      .header h2 {
        color: #ffffff;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .content {
        padding: clamp(24px, 5vw, 32px);
      }

      .field {
        margin-bottom: clamp(16px, 3vw, 20px);
        padding: clamp(16px, 3vw, 20px);
        background: #121212;
        border: 1px solid #1f1f1f;
        border-radius: 0px; /* Sharp corners */
        transition: border-color 0.2s ease;
      }

      .field:hover {
        border-color: rgba(230, 25, 25, 0.4);
      }

      .label {
        font-family: 'Space Mono', 'Courier New', monospace;
        font-weight: 700;
        color: #E61919; /* Red accent label */
        margin-bottom: 8px;
        display: block;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .field-content {
        color: rgba(255, 255, 255, 0.95);
        font-size: 1rem;
        word-break: break-word;
      }

      .field-content a {
        color: #E61919;
        text-decoration: none;
        font-family: 'Space Mono', 'Courier New', monospace;
        transition: color 0.2s ease, text-decoration 0.2s ease;
      }

      .field-content a:hover {
        color: #ff3333;
        text-decoration: underline;
      }

      .timestamp {
        margin-top: clamp(24px, 5vw, 32px);
        padding-top: clamp(16px, 3vw, 24px);
        border-top: 1px solid #1f1f1f;
        color: #555555;
        font-family: 'Space Mono', 'Courier New', monospace;
        font-size: 0.75rem;
        text-align: right;
      }

      @media print {
        body {
          background: none;
          padding: 0;
          color: #000000;
        }
        
        .email-container {
          border: none;
          max-width: 100%;
        }
        
        .field {
          background: #ffffff;
          border: 1px solid #dddddd;
        }
      }

      @media (max-width: 640px) {
        .field {
          margin-bottom: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <div class="header">
        <h2>New Contact Form Submission 📬</h2>
      </div>
      <div class="content">
        <div class="field">
          <span class="label">Name</span>
          <div class="field-content">{{name}}</div>
        </div>
        <div class="field">
          <span class="label">Email</span>
          <div class="field-content">
            <a href="mailto:{{email}}">{{email}}</a>
          </div>
        </div>
        <div class="field">
          <span class="label">Message</span>
          <div class="field-content">{{message}}</div>
        </div>
        <div class="timestamp">
          Received on {{timestamp}}
        </div>
      </div>
    </div>
  </body>
</html>
